<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="180" viewBox="0 0 1280 180" role="img" aria-labelledby="t d">
  <title id="t">Cheat sheet</title>
  <desc id="d">The head of the samebench guide "Cheat sheet". Every key for Neovim, tmux, lazygit, notebooks and .NET.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fd"/>
      <stop offset="1" stop-color="#e6e9f7"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="180" rx="18"/></clipPath>
    <clipPath id="typed"><rect x="0" y="0" width="27" height="20">
      <animate attributeName="width" dur="9s" repeatCount="indefinite" calcMode="discrete"
        values="27;0;9;18;27" keyTimes="0;0.5;0.65;0.75;0.85"/>
    </rect></clipPath>
  </defs>

  <!-- The page heads of all guides share this structure, and each comes in a dark and a light file.
       It is the banner of the README in small: the mark, the name, the title of the page and a glass terminal. -->
  <g clip-path="url(#frame)">
    <rect width="1280" height="180" fill="url(#bg)"/>
    <circle cx="1010" cy="20" r="140" fill="#8ff0c8" opacity="0.38" filter="url(#blur)"/>
    <circle cx="1230" cy="190" r="120" fill="#c3a6ff" opacity="0.38" filter="url(#blur)"/>
    <circle cx="80" cy="210" r="120" fill="#8ec5ff" opacity="0.16" filter="url(#blur)"/>

    <!-- Logo mark, the same three windows as in the banner, here at 36 px -->
    <g transform="translate(92 46) scale(0.5625)">
      <g transform="translate(-27 -25)" opacity="0.45">
        <rect width="30" height="24" rx="5" fill="#3b4261" stroke="#9aa2c7" stroke-opacity="0.6"/>
        <rect x="4" y="5" width="22" height="9" rx="2" fill="none" stroke="#8ff0c8" stroke-width="1.6"/>
        <rect x="4" y="16" width="10" height="4" rx="1.5" fill="#c3a6ff"/>
        <rect x="16" y="16" width="10" height="4" rx="1.5" fill="#ffc27a"/>
      </g>
      <g transform="translate(-15 -13)" opacity="0.7">
        <rect width="30" height="24" rx="5" fill="#3b4261" stroke="#9aa2c7" stroke-opacity="0.6"/>
        <rect x="4" y="5" width="22" height="9" rx="2" fill="none" stroke="#8ff0c8" stroke-width="1.6"/>
        <rect x="4" y="16" width="10" height="4" rx="1.5" fill="#c3a6ff"/>
        <rect x="16" y="16" width="10" height="4" rx="1.5" fill="#ffc27a"/>
      </g>
      <g transform="translate(-3 -1)" opacity="1">
        <rect width="30" height="24" rx="5" fill="#3b4261" stroke="#9aa2c7" stroke-opacity="0.6"/>
        <rect x="4" y="5" width="22" height="9" rx="2" fill="none" stroke="#8ff0c8" stroke-width="1.6"/>
        <rect x="4" y="16" width="10" height="4" rx="1.5" fill="#c3a6ff"/>
        <rect x="16" y="16" width="10" height="4" rx="1.5" fill="#ffc27a"/>
      </g>
    </g>
    <text x="122" y="53" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5170" letter-spacing="-0.3">samebench</text>

    <!-- Title of the page -->
    <text x="74" y="112" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#1b1e36" letter-spacing="-1.2">Cheat sheet</text>
    <text x="74" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#4a5170">Every key for Neovim, tmux, lazygit, notebooks and .NET.</text>

    <!-- Terminal window made of glass, with a command of this page and its topics -->
    <g transform="translate(760 28)">
      <rect width="452" height="124" rx="14" fill="#14162a" opacity="0.86"/>
      <rect width="452" height="124" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.16"/>
      <circle cx="20" cy="18" r="5" fill="#ff757f"/><circle cx="38" cy="18" r="5" fill="#ffc27a"/><circle cx="56" cy="18" r="5" fill="#c3e88d"/>
      <text x="226" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6b7089">docs/cheatsheet.md</text>
      <text x="24" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8ff0c8">❯</text>
      <g transform="translate(42 48)">
        <text y="14" clip-path="url(#typed)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#eef1ff">dev</text>
        <rect x="27" y="2" width="8" height="15" fill="#8ff0c8">
          <animate attributeName="x" dur="9s" repeatCount="indefinite" calcMode="discrete"
            values="27;0;9;18;27" keyTimes="0;0.5;0.65;0.75;0.85"/>
          <animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" values="1;0"/>
        </rect>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
        <rect x="24" y="84" width="71" height="24" rx="12" fill="#8ff0c8"/>
        <text x="59.5" y="100.5" text-anchor="middle" fill="#14162a" font-weight="700">neovim</text>
        <rect x="103" y="84" width="55" height="24" rx="12" fill="#2a2e45"/>
        <text x="130.5" y="100.5" text-anchor="middle" fill="#c3a6ff">tmux</text>
        <rect x="166" y="84" width="79" height="24" rx="12" fill="#2a2e45"/>
        <text x="205.5" y="100.5" text-anchor="middle" fill="#ffc27a">lazygit</text>
        <rect x="253" y="84" width="94" height="24" rx="12" fill="#2a2e45"/>
        <text x="300" y="100.5" text-anchor="middle" fill="#ff9ecf">notebooks</text>
        <rect x="355" y="84" width="55" height="24" rx="12" fill="#2a2e45"/>
        <text x="382.5" y="100.5" text-anchor="middle" fill="#8ec5ff">.net</text>
      </g>
    </g>
  </g>
</svg>
