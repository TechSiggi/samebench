<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Three layers of settings</title>
  <desc id="d">A setting is decided in three layers, read from left to right, and the layer read last wins. First come the built-in defaults in bin/samebench, one for every setting, for example MODULES="core", LAYOUT="code", AGENT_CMD="", ICONS="unicode", ACTIVATE="global", UPDATER="no" and NODE="samebench", and five more that the card only counts. Then comes the profile, profiles/mac.sh or profiles/linux.sh. It is part of the repository, the same on every machine of that kind, chosen once with samebench apply mac, and it only lists what differs, here MODULES="core python", AGENT_CMD="claude" and ICONS="nerd". Last comes ~/.config/samebench/local.sh, which is outside the repository and concerns this machine only, here with MODULES="core python web dotnet", ACTIVATE="dev" and UPDATER="yes". The card on the right shows the values in effect on this machine, as samebench doctor shows them, each marked with the layer it comes from. A wire follows MODULES through every layer, from core to core python to core python web dotnet. A second wire follows ICONS, which changes from unicode to nerd in the profile and stays nerd because local.sh does not set it. Values that a later layer replaces are struck through.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .win { fill: #14162a; stroke: #2a2e45; }
      .act { fill: #16182a; stroke: #8ff0c8; }
      .ina { fill: #1c1f33; stroke: #3b4261; }
      .lbl { font-size: 13px; font-weight: 700; }
      .sub { font-size: 11px; fill: #6b7089; }
      .num { font-size: 12px; font-weight: 700; fill: #14162a; }
      .code { font-size: 12.5px; fill: #c8d3f5; }
      .old { fill: #6b7089; }
      .val { fill: #8ff0c8; }
      .none { fill: none; stroke: #3b4261; stroke-width: 2; stroke-dasharray: 0.1 7; stroke-linecap: round; }
      .pill { fill: #2a2e45; }
      .tube { fill: #14162a; stroke: #2a2e45; }
      .wire { fill: none; stroke: #8ff0c8; stroke-width: 2; stroke-linecap: round; }
      .pass { fill: none; stroke: #8ff0c8; stroke-width: 2; stroke-dasharray: 4 5; stroke-opacity: 0.6; }
      .plug { fill: #8ff0c8; stroke: #14162a; stroke-width: 2; }
    </style>
  </defs>

  <!-- Tubes that carry the two wires across the page background, so they read on a light and a dark page.
       Drawn first, the cards sit on top of their ends. Row 1 is MODULES, row 4 is ICONS. -->
  <g class="tube">
    <rect x="264" y="98" width="52" height="8"/><rect x="574" y="98" width="52" height="8"/><rect x="914" y="98" width="52" height="8"/>
    <rect x="264" y="182" width="52" height="8"/><rect x="574" y="182" width="52" height="8"/><rect x="914" y="182" width="52" height="8"/>
  </g>

  <!-- Every card has the same rows: MODULES, LAYOUT, AGENT_CMD, ICONS, ACTIVATE, UPDATER and a last line with NODE and
       the count of the rest. A dotted row means that this layer does not set the setting, so the value from before stays. -->

  <!-- 1: the built-in defaults, set in load_profile in bin/samebench before the profile is read -->
  <g>
    <rect class="win" width="270" height="340" rx="14"/>
    <circle cx="26" cy="26" r="11" fill="#8ec5ff"/>
    <text class="mono num" x="26" y="30.5" text-anchor="middle">1</text>
    <text class="mono lbl" x="46" y="31" fill="#8ec5ff">built-in defaults</text>
    <text class="mono sub" x="46" y="50">in bin/samebench,</text>
    <text class="mono sub" x="46" y="64">one for every setting</text>
    <rect class="ina" x="12" y="80" width="246" height="212" rx="8"/>
    <g class="mono code">
      <text x="26" y="106" class="old">MODULES=<tspan text-decoration="line-through">"core"</tspan></text>
      <text x="26" y="134">LAYOUT=<tspan class="val">"code"</tspan></text>
      <text x="26" y="162" class="old">AGENT_CMD=<tspan text-decoration="line-through">""</tspan></text>
      <text x="26" y="190" class="old">ICONS=<tspan text-decoration="line-through">"unicode"</tspan></text>
      <text x="26" y="218" class="old">ACTIVATE=<tspan text-decoration="line-through">"global"</tspan></text>
      <text x="26" y="246" class="old">UPDATER=<tspan text-decoration="line-through">"no"</tspan></text>
      <text x="26" y="274">NODE=<tspan class="val">"samebench"</tspan><tspan class="old"> # +5 more</tspan></text>
    </g>
    <text class="mono sub" x="16" y="318">used when no later layer sets it</text>
  </g>

  <!-- 2: the profile, part of the repository. It lists only what differs from the defaults. -->
  <g transform="translate(310 0)">
    <rect class="win" width="270" height="340" rx="14"/>
    <circle cx="26" cy="26" r="11" fill="#c3a6ff"/>
    <text class="mono num" x="26" y="30.5" text-anchor="middle">2</text>
    <text class="mono lbl" x="46" y="31" fill="#c3a6ff">profiles/mac.sh</text>
    <text class="mono sub" x="256" y="31" text-anchor="end">or linux.sh</text>
    <text class="mono sub" x="46" y="50">in the repository, the same on</text>
    <text class="mono sub" x="46" y="64">every machine of that kind</text>
    <rect class="ina" x="12" y="80" width="246" height="212" rx="8"/>
    <g class="mono code">
      <text x="26" y="106" class="old">MODULES=<tspan text-decoration="line-through">"core python"</tspan></text>
      <text x="26" y="162">AGENT_CMD=<tspan class="val">"claude"</tspan></text>
      <text x="26" y="190">ICONS=<tspan class="val">"nerd"</tspan></text>
    </g>
    <path class="none" d="M26 130 H244 M26 214 H244 M26 242 H244"/>
    <rect class="pill" x="12" y="303" width="157" height="22" rx="11"/>
    <text class="mono" x="90.5" y="318" text-anchor="middle" font-size="11" fill="#c8d3f5"><tspan fill="#8ff0c8">❯</tspan> samebench apply mac</text>
    <text class="mono sub" x="179" y="318">chosen once</text>
  </g>

  <!-- 3: local.sh, read after the profile and not part of the repository -->
  <g transform="translate(620 0)">
    <rect class="win" width="300" height="340" rx="14"/>
    <circle cx="26" cy="26" r="11" fill="#ffc27a"/>
    <text class="mono num" x="26" y="30.5" text-anchor="middle">3</text>
    <text class="mono lbl" x="46" y="31" fill="#ffc27a">~/.config/samebench/local.sh</text>
    <text class="mono sub" x="46" y="50">outside the repository,</text>
    <text class="mono sub" x="46" y="64">this machine only</text>
    <rect class="ina" x="12" y="80" width="276" height="212" rx="8"/>
    <g class="mono code">
      <text x="26" y="106">MODULES=<tspan class="val">"core python web dotnet"</tspan></text>
      <text x="26" y="218">ACTIVATE=<tspan class="val">"dev"</tspan></text>
      <text x="26" y="246">UPDATER=<tspan class="val">"yes"</tspan></text>
    </g>
    <path class="none" d="M26 130 H274 M26 158 H274"/>
    <!-- ICONS is not set here: its wire runs straight through, and nerd from the profile stays -->
    <path class="pass" d="M12 186 H288"/>
    <rect x="64" y="177" width="172" height="18" rx="9" fill="#1c1f33"/>
    <text class="mono sub" x="150" y="190" text-anchor="middle">not set here, nerd stays</text>
    <text class="mono sub" x="16" y="318">read after the profile</text>
  </g>

  <!-- 4: the result, what samebench doctor shows. The number in front of each line is the layer it comes from. -->
  <g transform="translate(960 0)">
    <rect class="win" width="320" height="340" rx="14"/>
    <circle cx="26" cy="26" r="11" fill="#8ff0c8"/>
    <text class="mono num" x="26" y="30.5" text-anchor="middle">✓</text>
    <text class="mono lbl" x="46" y="31" fill="#8ff0c8">in effect on this machine</text>
    <text class="mono sub" x="46" y="50">the layer read last wins,</text>
    <text class="mono sub" x="46" y="64">for each setting on its own</text>
    <rect class="act" x="12" y="80" width="296" height="212" rx="8"/>
    <g class="num" font-size="10">
      <circle cx="30" cy="102" r="8" fill="#ffc27a"/><text class="mono" x="30" y="105.5" text-anchor="middle" font-size="10">3</text>
      <circle cx="30" cy="130" r="8" fill="#8ec5ff"/><text class="mono" x="30" y="133.5" text-anchor="middle" font-size="10">1</text>
      <circle cx="30" cy="158" r="8" fill="#c3a6ff"/><text class="mono" x="30" y="161.5" text-anchor="middle" font-size="10">2</text>
      <circle cx="30" cy="186" r="8" fill="#c3a6ff"/><text class="mono" x="30" y="189.5" text-anchor="middle" font-size="10">2</text>
      <circle cx="30" cy="214" r="8" fill="#ffc27a"/><text class="mono" x="30" y="217.5" text-anchor="middle" font-size="10">3</text>
      <circle cx="30" cy="242" r="8" fill="#ffc27a"/><text class="mono" x="30" y="245.5" text-anchor="middle" font-size="10">3</text>
      <circle cx="30" cy="270" r="8" fill="#8ec5ff"/><text class="mono" x="30" y="273.5" text-anchor="middle" font-size="10">1</text>
    </g>
    <g class="mono code">
      <text x="46" y="106">MODULES=<tspan class="val">"core python web dotnet"</tspan></text>
      <text x="46" y="134">LAYOUT=<tspan class="val">"code"</tspan></text>
      <text x="46" y="162">AGENT_CMD=<tspan class="val">"claude"</tspan></text>
      <text x="46" y="190">ICONS=<tspan class="val">"nerd"</tspan></text>
      <text x="46" y="218">ACTIVATE=<tspan class="val">"dev"</tspan></text>
      <text x="46" y="246">UPDATER=<tspan class="val">"yes"</tspan></text>
      <text x="46" y="274">NODE=<tspan class="val">"samebench"</tspan><tspan class="old"> # +5 more</tspan></text>
    </g>
    <rect class="pill" x="12" y="303" width="136" height="22" rx="11"/>
    <text class="mono" x="80" y="318" text-anchor="middle" font-size="11" fill="#c8d3f5"><tspan fill="#8ff0c8">❯</tspan> samebench doctor</text>
    <text class="mono sub" x="158" y="318">shows these values</text>
  </g>

  <!-- The two wires and their plugs, on top of the cards: MODULES in row 1 and ICONS in row 4 -->
  <path class="wire" d="M258 102 H322 M568 102 H632 M908 102 H972"/>
  <path class="wire" d="M258 186 H322 M568 186 H632 M908 186 H972"/>
  <g class="plug">
    <circle cx="258" cy="102" r="5"/><circle cx="322" cy="102" r="5"/><circle cx="568" cy="102" r="5"/>
    <circle cx="632" cy="102" r="5"/><circle cx="908" cy="102" r="5"/><circle cx="972" cy="102" r="5"/>
    <circle cx="258" cy="186" r="5"/><circle cx="322" cy="186" r="5"/><circle cx="568" cy="186" r="5"/>
    <circle cx="632" cy="186" r="5"/><circle cx="908" cy="186" r="5"/><circle cx="972" cy="186" r="5"/>
  </g>
</svg>
