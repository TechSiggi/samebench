<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="464" viewBox="0 0 1280 464" role="img" aria-labelledby="t d">
  <title id="t">Pinned lists and the questions before every install</title>
  <desc id="d">Ten sources on the left, each wired to the question that comes before it on the right, in the order the questions come. samebench apply linux first asks before apt installs a missing .NET SDK, which comes from your system, signed by Ubuntu or by Microsoft, and is not a pinned list of this repository. It then shows its plan and asks once for five pinned lists. bin/samebench pins mise by version and SHA-256, mise.lock pins the tools and Node.js with checksums, lazy-lock.json pins the plugins at exact commits, envs/web/package-lock.json pins the web language servers with integrity hashes, and envs/dotnet/tools.txt pins the .NET tools by exact version. dev -j first asks whether you trust the folder before the editor may load the project's own code, which is not an install at all. It then asks on its own about three pinned lists. envs/jupyter/uv.lock pins the Jupyter tool, the uv.lock of a project pins its packages, and uv holds the checksums for Python.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .win { fill: #14162a; stroke: #2a2e45; }
      .act { fill: #16182a; stroke: #8ff0c8; }
      .ina { fill: #1c1f33; stroke: #3b4261; }
      .sys { fill: #1c1f33; stroke: #3b4261; stroke-dasharray: 5 4; }
      .ttl { font-size: 13px; font-weight: 700; fill: #8ff0c8; }
      .name { font-size: 15px; font-weight: 700; }
      .sub { font-size: 11.5px; fill: #6b7089; }
      .tag { font-size: 11.5px; }
      .cmd { font-size: 13px; fill: #c8d3f5; }
      .ask { font-size: 15px; font-weight: 700; fill: #eef1ff; }
      .pill { fill: #2a2e45; }
      .hull { fill: none; stroke: #2a2e45; stroke-width: 8; }
      .tube { fill: none; stroke: #14162a; stroke-width: 6; }
      .wire { fill: none; stroke-width: 2; }
      .plug { stroke: #14162a; stroke-width: 2; }
    </style>
    <g id="dots"><circle cx="18" cy="16" r="4.5" fill="#ff757f"/><circle cx="34" cy="16" r="4.5" fill="#ffc27a"/><circle cx="50" cy="16" r="4.5" fill="#c3e88d"/></g>
    <!-- padlock, takes its colour from the color attribute of the use element -->
    <g id="lock">
      <path d="M3.5 9 V6 a4.5 4.5 0 0 1 9 0 V9" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="0" y="9" width="16" height="12" rx="3" fill="currentColor"/>
      <circle cx="8" cy="15" r="1.6" fill="#14162a"/>
    </g>
    <!-- open ring for what is not a pinned list of this repository, coloured like the padlock -->
    <g id="ring"><circle cx="8" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <!-- the ten wires, from a source on the left to its question on the right -->
    <path id="w1" d="M508 55 C640 55 640 109 772 109"/>
    <path id="w2" d="M508 97 C640 97 640 203 772 203"/>
    <path id="w3" d="M508 139 C640 139 640 209 772 209"/>
    <path id="w4" d="M508 181 C640 181 640 215 772 215"/>
    <path id="w5" d="M508 223 C640 223 640 221 772 221"/>
    <path id="w6" d="M508 265 C640 265 640 227 772 227"/>
    <path id="w7" d="M508 307 C640 307 640 311 772 311"/>
    <path id="w8" d="M508 349 C640 349 640 353 772 353"/>
    <path id="w9" d="M508 391 C640 391 640 395 772 395"/>
    <path id="w10" d="M508 433 C640 433 640 437 772 437"/>
  </defs>

  <!-- Dark tubes around the wires, so they read on a light and a dark page. Drawn first, the windows cover their ends. -->
  <g class="hull"><use href="#w1"/><use href="#w2"/><use href="#w3"/><use href="#w4"/><use href="#w5"/><use href="#w6"/><use href="#w7"/><use href="#w8"/><use href="#w9"/><use href="#w10"/></g>
  <g class="tube"><use href="#w1"/><use href="#w2"/><use href="#w3"/><use href="#w4"/><use href="#w5"/><use href="#w6"/><use href="#w7"/><use href="#w8"/><use href="#w9"/><use href="#w10"/></g>

  <!-- Left: where each piece comes from, in the order of the questions. Solid rows with a padlock are pinned
       lists of this repository, dashed rows with a ring come from your system or the project. -->
  <g>
    <rect class="win" width="520" height="464" rx="14"/>
    <use href="#dots"/>
    <text class="mono ttl" x="260" y="21" text-anchor="middle">comes from a pinned list, or from outside it</text>

    <rect class="sys" x="12" y="36" width="496" height="38" rx="8"/>
    <use href="#ring" x="28" y="44" color="#c8d3f5"/>
    <text class="mono name" x="58" y="53" fill="#c8d3f5">your system</text>
    <text class="mono sub" x="58" y="67">Ubuntu's signed archive or Microsoft's installer</text>
    <rect class="pill" x="416" y="44" width="80" height="22" rx="11"/>
    <text class="mono tag" x="456" y="59" text-anchor="middle" fill="#c8d3f5">.NET SDK</text>

    <rect class="ina" x="12" y="78" width="496" height="38" rx="8"/>
    <use href="#lock" x="28" y="86" color="#8ff0c8"/>
    <text class="mono name" x="58" y="95" fill="#8ff0c8">bin/samebench</text>
    <text class="mono sub" x="58" y="109">version and SHA-256</text>
    <rect class="pill" x="444" y="86" width="52" height="22" rx="11"/>
    <text class="mono tag" x="470" y="101" text-anchor="middle" fill="#8ff0c8">mise</text>

    <rect class="ina" x="12" y="120" width="496" height="38" rx="8"/>
    <use href="#lock" x="28" y="128" color="#8ec5ff"/>
    <text class="mono name" x="58" y="137" fill="#8ec5ff">mise.lock</text>
    <text class="mono sub" x="58" y="151">checksums per platform</text>
    <rect class="pill" x="374" y="128" width="122" height="22" rx="11"/>
    <text class="mono tag" x="435" y="143" text-anchor="middle" fill="#8ec5ff">tools, Node.js</text>

    <rect class="ina" x="12" y="162" width="496" height="38" rx="8"/>
    <use href="#lock" x="28" y="170" color="#c3a6ff"/>
    <text class="mono name" x="58" y="179" fill="#c3a6ff">lazy-lock.json</text>
    <text class="mono sub" x="58" y="193">exact commits</text>
    <rect class="pill" x="424" y="170" width="72" height="22" rx="11"/>
    <text class="mono tag" x="460" y="185" text-anchor="middle" fill="#c3a6ff">plugins</text>

    <rect class="ina" x="12" y="204" width="496" height="38" rx="8"/>
    <use href="#lock" x="28" y="212" color="#ff966c"/>
    <text class="mono name" x="58" y="221" fill="#ff966c">envs/web/package-lock.json</text>
    <text class="mono sub" x="58" y="235">an integrity hash for every package</text>
    <rect class="pill" x="334" y="212" width="162" height="22" rx="11"/>
    <text class="mono tag" x="415" y="227" text-anchor="middle" fill="#ff966c">web language servers</text>

    <rect class="ina" x="12" y="246" width="496" height="38" rx="8"/>
    <use href="#lock" x="28" y="254" color="#86e1fc"/>
    <text class="mono name" x="58" y="263" fill="#86e1fc">envs/dotnet/tools.txt</text>
    <text class="mono sub" x="58" y="277">exact versions, without a checksum of their own</text>
    <rect class="pill" x="402" y="254" width="94" height="22" rx="11"/>
    <text class="mono tag" x="449" y="269" text-anchor="middle" fill="#86e1fc">.NET tools</text>

    <rect class="sys" x="12" y="288" width="496" height="38" rx="8"/>
    <use href="#ring" x="28" y="296" color="#ff757f"/>
    <text class="mono name" x="58" y="305" fill="#ff757f">the project's own code</text>
    <text class="mono sub" x="58" y="319">its TypeScript, ESLint and MSBuild targets</text>
    <rect class="pill" x="374" y="296" width="122" height="22" rx="11"/>
    <text class="mono tag" x="435" y="311" text-anchor="middle" fill="#ff757f">not an install</text>

    <rect class="ina" x="12" y="330" width="496" height="38" rx="8"/>
    <use href="#lock" x="28" y="338" color="#ffc27a"/>
    <text class="mono name" x="58" y="347" fill="#ffc27a">envs/jupyter/uv.lock</text>
    <text class="mono sub" x="58" y="361">a hash for every package</text>
    <rect class="pill" x="388" y="338" width="108" height="22" rx="11"/>
    <text class="mono tag" x="442" y="353" text-anchor="middle" fill="#ffc27a">Jupyter tool</text>

    <rect class="ina" x="12" y="372" width="496" height="38" rx="8"/>
    <use href="#lock" x="28" y="380" color="#ff9ecf"/>
    <text class="mono name" x="58" y="389" fill="#ff9ecf">the project's uv.lock</text>
    <text class="mono sub" x="58" y="403">exactly as locked</text>
    <rect class="pill" x="360" y="380" width="136" height="22" rx="11"/>
    <text class="mono tag" x="428" y="395" text-anchor="middle" fill="#ff9ecf">project packages</text>

    <rect class="ina" x="12" y="414" width="496" height="38" rx="8"/>
    <use href="#lock" x="28" y="422" color="#c3e88d"/>
    <text class="mono name" x="58" y="431" fill="#c3e88d">uv</text>
    <text class="mono sub" x="58" y="445">checksums stored in uv</text>
    <rect class="pill" x="430" y="422" width="66" height="22" rx="11"/>
    <text class="mono tag" x="463" y="437" text-anchor="middle" fill="#c3e88d">Python</text>
  </g>

  <!-- Right: the terminal, the questions in the order they come. Quoted from bin/samebench and bin/dev. -->
  <g transform="translate(760 0)">
    <rect class="win" width="520" height="464" rx="14"/>
    <use href="#dots"/>
    <text class="mono ttl" x="260" y="21" text-anchor="middle">and asks before it installs or runs it</text>

    <rect class="act" x="12" y="34" width="496" height="198" rx="8"/>
    <text class="mono cmd" x="28" y="58"><tspan fill="#8ff0c8">❯</tspan> samebench apply linux</text>
    <text class="mono sub" x="28" y="80">Missing .NET SDK 10.0. Your package sources offer dotnet-sdk-10.0 …</text>
    <text class="mono ask" x="28" y="100">Install it now with</text>
    <text class="mono ask" x="28" y="118">"sudo apt-get install -y dotnet-sdk-10.0"? [y/N]</text>
    <text class="mono" x="28" y="142" font-size="11.5" fill="#c8d3f5"><tspan fill="#8ec5ff" font-weight="700">==&gt;</tspan> Plan for profile "linux" … NOTHING is changed yet</text>
    <!-- the plan, one line per pinned list -->
    <g class="mono" font-size="10" fill="#6b7089"><text x="38" y="156">↓</text><text x="38" y="167">↓</text><text x="38" y="178">↓</text><text x="38" y="189">↓</text><text x="38" y="200">↓</text></g>
    <g>
      <rect x="58" y="149" width="34" height="6" rx="3" fill="#8ff0c8"/><rect x="150" y="149" width="52" height="6" rx="3" fill="#6b7089" opacity="0.7"/><rect x="222" y="149" width="96" height="6" rx="3" fill="#6b7089" opacity="0.7"/>
      <rect x="58" y="160" width="50" height="6" rx="3" fill="#8ec5ff"/><rect x="150" y="160" width="40" height="6" rx="3" fill="#6b7089" opacity="0.7"/><rect x="222" y="160" width="60" height="6" rx="3" fill="#6b7089" opacity="0.7"/>
      <rect x="58" y="171" width="66" height="6" rx="3" fill="#c3a6ff"/><rect x="150" y="171" width="130" height="6" rx="3" fill="#6b7089" opacity="0.7"/>
      <rect x="58" y="182" width="78" height="6" rx="3" fill="#ff966c"/><rect x="150" y="182" width="110" height="6" rx="3" fill="#6b7089" opacity="0.7"/>
      <rect x="58" y="193" width="56" height="6" rx="3" fill="#86e1fc"/><rect x="150" y="193" width="46" height="6" rx="3" fill="#6b7089" opacity="0.7"/><rect x="222" y="193" width="72" height="6" rx="3" fill="#6b7089" opacity="0.7"/>
    </g>
    <text class="mono ask" x="28" y="222">Set it up like this? [y/N] <tspan fill="#8ff0c8">█<animate attributeName="fill-opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" values="1;0"/></tspan></text>

    <rect class="ina" x="12" y="240" width="496" height="212" rx="8"/>
    <text class="mono cmd" x="28" y="263"><tspan fill="#8ff0c8">❯</tspan> dev -j</text>
    <text class="mono sub" x="28" y="284">The language servers and formatters can load code</text>
    <text class="mono sub" x="28" y="298">from this folder: /home/you/code/shop-frontend</text>
    <text class="mono ask" x="28" y="316">Trust this folder and every folder below it? [y/N]</text>
    <text class="mono sub" x="28" y="340">The Jupyter tool is not installed yet.</text>
    <text class="mono ask" x="28" y="358">Install it now? [y/N]</text>
    <text class="mono sub" x="28" y="382">This project wants 14 packages in its .venv …</text>
    <text class="mono ask" x="28" y="400">Install them? [y/N]</text>
    <text class="mono sub" x="28" y="424">The project needs Python &gt;=3.12, which is missing here.</text>
    <text class="mono ask" x="28" y="442">Install it with uv? [y/N]</text>
  </g>

  <!-- The wires and their plugs, on top of the windows -->
  <g class="wire">
    <use href="#w1" stroke="#c8d3f5"/><use href="#w2" stroke="#8ff0c8"/><use href="#w3" stroke="#8ec5ff"/><use href="#w4" stroke="#c3a6ff"/><use href="#w5" stroke="#ff966c"/><use href="#w6" stroke="#86e1fc"/><use href="#w7" stroke="#ff757f"/><use href="#w8" stroke="#ffc27a"/><use href="#w9" stroke="#ff9ecf"/><use href="#w10" stroke="#c3e88d"/>
  </g>
  <g class="plug">
    <circle cx="508" cy="55" r="5" fill="#c8d3f5"/><circle cx="772" cy="109" r="5" fill="#c8d3f5"/>
    <circle cx="508" cy="97" r="5" fill="#8ff0c8"/><circle cx="772" cy="203" r="4" fill="#8ff0c8"/>
    <circle cx="508" cy="139" r="5" fill="#8ec5ff"/><circle cx="772" cy="209" r="4" fill="#8ec5ff"/>
    <circle cx="508" cy="181" r="5" fill="#c3a6ff"/><circle cx="772" cy="215" r="4" fill="#c3a6ff"/>
    <circle cx="508" cy="223" r="5" fill="#ff966c"/><circle cx="772" cy="221" r="4" fill="#ff966c"/>
    <circle cx="508" cy="265" r="5" fill="#86e1fc"/><circle cx="772" cy="227" r="4" fill="#86e1fc"/>
    <circle cx="508" cy="307" r="5" fill="#ff757f"/><circle cx="772" cy="311" r="5" fill="#ff757f"/>
    <circle cx="508" cy="349" r="5" fill="#ffc27a"/><circle cx="772" cy="353" r="5" fill="#ffc27a"/>
    <circle cx="508" cy="391" r="5" fill="#ff9ecf"/><circle cx="772" cy="395" r="5" fill="#ff9ecf"/>
    <circle cx="508" cy="433" r="5" fill="#c3e88d"/><circle cx="772" cy="437" r="5" fill="#c3e88d"/>
  </g>
</svg>
