<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="t d">
  <title id="t">One updater, every machine follows</title>
  <desc id="d">New versions enter through one machine and travel through the repository to every other machine. On the left is the updater, the one machine with UPDATER="yes". In step 1 it runs samebench update once a month, which only takes versions that are at least seven days old, or samebench fix after a high or critical advisory. In step 2 it commits and pushes the lockfiles, signed if you sign your commits. In the middle, the repository on GitHub is the list of approved versions. It holds the lockfiles mise.lock, lazy-lock.json, uv.lock and package-lock.json, and the new commit on its main branch. On the right is every other machine. In step 3 the daily check in the first dev of the day notices the new commit and offers samebench sync. In step 4 samebench sync fetches the new state, shows the commit, verifies that it carries your signature and asks before it takes it, and then samebench apply installs exactly what the lockfiles say.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .win { fill: #14162a; stroke: #2a2e45; }
      .act { fill: #16182a; stroke: #8ff0c8; }
      .ina { fill: #1c1f33; stroke: #3b4261; }
      .ttl { font-size: 13px; font-weight: 700; fill: #8ff0c8; }
      .lbl { font-size: 13px; font-weight: 700; }
      .sub { font-size: 11px; fill: #6b7089; }
      .out { font-size: 11px; fill: #c8d3f5; }
      .cmd { font-size: 13px; fill: #c8d3f5; }
      .ask { font-size: 14px; font-weight: 700; fill: #eef1ff; }
      .pill { fill: #2a2e45; }
      .tube { fill: #14162a; stroke: #2a2e45; }
      .wire { fill: none; stroke: #8ff0c8; stroke-width: 2; stroke-linecap: round; }
      .plug { fill: #8ff0c8; stroke: #14162a; stroke-width: 2; }
      .step { fill: #14162a; stroke: #8ff0c8; stroke-width: 1.5; }
      .num { font-size: 12px; font-weight: 700; fill: #8ff0c8; }
    </style>
    <g id="dots"><circle cx="18" cy="16" r="4.5" fill="#ff757f"/><circle cx="34" cy="16" r="4.5" fill="#ffc27a"/><circle cx="50" cy="16" r="4.5" fill="#c3e88d"/></g>
    <!-- padlock, takes its colour from the color attribute of the use element (the same mark as in supply-chain.svg) -->
    <g id="lock">
      <path d="M3.5 9 V6 a4.5 4.5 0 0 1 9 0 V9" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="0" y="9" width="16" height="12" rx="3" fill="currentColor"/>
      <circle cx="8" cy="15" r="1.6" fill="#14162a"/>
    </g>
  </defs>

  <!-- Tubes that carry the two wires across the page background, so they read on a light and a dark page.
       Drawn first, the windows and the repository card sit on top of their ends. -->
  <rect class="tube" x="440" y="193" width="90" height="8"/>
  <rect class="tube" x="750" y="89" width="90" height="8"/>

  <!-- Left: the updater, the one machine with UPDATER="yes" in ~/.config/samebench/local.sh.
       Step 1 brings in the new versions, step 2 commits and pushes the lockfiles. -->
  <g>
    <rect class="win" width="450" height="330" rx="14"/>
    <use href="#dots"/>
    <text class="mono ttl" x="225" y="21" text-anchor="middle">the updater</text>
    <rect class="pill" x="336" y="7" width="102" height="19" rx="9.5"/>
    <text class="mono" x="387" y="20.5" text-anchor="middle" font-size="11" fill="#8ff0c8">UPDATER="yes"</text>

    <rect class="act" x="12" y="34" width="426" height="124" rx="8"/>
    <circle class="step" cx="30" cy="54" r="11"/><text class="mono num" x="30" y="58" text-anchor="middle">1</text>
    <text class="mono lbl" x="48" y="58" fill="#8ff0c8">update day</text>
    <text class="mono sub" x="136" y="58">once a month</text>
    <text class="mono cmd" x="28" y="86"><tspan fill="#8ff0c8">❯</tspan> samebench update</text>
    <text class="mono sub" x="182" y="86">versions at least seven days old</text>
    <text class="mono sub" x="28" y="110">or, after a high or critical advisory from the daily check</text>
    <text class="mono cmd" x="28" y="136"><tspan fill="#8ff0c8">❯</tspan> samebench fix</text>
    <text class="mono sub" x="159" y="136">only that package, to the fixed version</text>

    <rect class="ina" x="12" y="166" width="426" height="150" rx="8"/>
    <circle class="step" cx="30" cy="186" r="11"/><text class="mono num" x="30" y="190" text-anchor="middle">2</text>
    <text class="mono lbl" x="48" y="190" fill="#c8d3f5">commit and push</text>
    <text class="mono sub" x="175" y="190">the lockfiles</text>
    <text class="mono cmd" x="28" y="218"><tspan fill="#8ff0c8">❯</tspan> git commit -am "Build: update locked versions"</text>
    <text class="mono cmd" x="28" y="240"><tspan fill="#8ff0c8">❯</tspan> git push</text>
    <use href="#lock" transform="translate(28 255) scale(0.7)" color="#c3e88d"/>
    <text class="mono sub" x="46" y="268">signed, if you sign your commits</text>
    <text class="mono sub" x="28" y="292">samebench fix offers this right after the fix</text>
  </g>

  <!-- Middle: the repository on GitHub, the list of approved versions. The push lands on the lockfiles,
       which become the new commit on main, and the daily check of the other machines notices that commit. -->
  <g>
    <rect class="win" x="520" y="0" width="240" height="330" rx="14"/>
    <text class="mono ttl" x="640" y="28" text-anchor="middle">repository on GitHub</text>
    <text class="mono sub" x="640" y="46" text-anchor="middle">the list of approved versions</text>

    <!-- the main branch, older commits muted and the new one in mint -->
    <text class="mono" x="536" y="74" font-size="11" fill="#c3a6ff">⎇ main</text>
    <text class="mono" x="744" y="74" text-anchor="end" font-size="11" fill="#8ff0c8">1 new commit</text>
    <path d="M536 93 H658" fill="none" stroke="#3b4261" stroke-width="2"/>
    <g fill="#1c1f33" stroke="#6b7089" stroke-width="1.5">
      <circle cx="556" cy="93" r="4.5"/><circle cx="590" cy="93" r="4.5"/><circle cx="624" cy="93" r="4.5"/><circle cx="658" cy="93" r="4.5"/>
    </g>
    <rect x="536" y="116" width="208" height="1" fill="#2a2e45"/>

    <!-- the lockfiles, coloured like their rows in supply-chain.svg -->
    <g class="mono" font-size="12">
      <rect class="pill" x="546" y="132" width="196" height="28" rx="14"/>
      <use href="#lock" transform="translate(560 138) scale(0.75)" color="#8ec5ff"/>
      <text x="582" y="150" fill="#8ec5ff">mise.lock</text>
      <rect class="pill" x="546" y="166" width="196" height="28" rx="14"/>
      <use href="#lock" transform="translate(560 172) scale(0.75)" color="#c3a6ff"/>
      <text x="582" y="184" fill="#c3a6ff">lazy-lock.json</text>
      <rect class="pill" x="546" y="200" width="196" height="28" rx="14"/>
      <use href="#lock" transform="translate(560 206) scale(0.75)" color="#ffc27a"/>
      <text x="582" y="218" fill="#ffc27a">uv.lock</text>
      <rect class="pill" x="546" y="234" width="196" height="28" rx="14"/>
      <use href="#lock" transform="translate(560 240) scale(0.75)" color="#ff966c"/>
      <text x="582" y="252" fill="#ff966c">package-lock.json</text>
    </g>
    <!-- each pill lights up in its colour while the push arrives, invisible in the first frame -->
    <g fill="none" stroke-width="1.5" stroke-opacity="0">
      <rect x="546" y="132" width="196" height="28" rx="14" stroke="#8ec5ff"><animate attributeName="stroke-opacity" dur="8s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.2;0.25;0.36;1"/></rect>
      <rect x="546" y="166" width="196" height="28" rx="14" stroke="#c3a6ff"><animate attributeName="stroke-opacity" dur="8s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.2;0.25;0.36;1"/></rect>
      <rect x="546" y="200" width="196" height="28" rx="14" stroke="#ffc27a"><animate attributeName="stroke-opacity" dur="8s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.2;0.25;0.36;1"/></rect>
      <rect x="546" y="234" width="196" height="28" rx="14" stroke="#ff966c"><animate attributeName="stroke-opacity" dur="8s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.2;0.25;0.36;1"/></rect>
    </g>

    <text class="mono sub" x="640" y="296" text-anchor="middle">every machine installs</text>
    <text class="mono sub" x="640" y="312" text-anchor="middle">exactly these versions</text>
  </g>

  <!-- Right: every other machine. Step 3 is the daily check in the first dev of the day,
       step 4 is samebench sync, which ends in samebench apply. The output lines are quoted from bin/samebench. -->
  <g transform="translate(830 0)">
    <rect class="win" width="450" height="330" rx="14"/>
    <use href="#dots"/>
    <text class="mono ttl" x="225" y="21" text-anchor="middle">every other machine</text>

    <rect class="ina" x="12" y="34" width="426" height="124" rx="8"/>
    <circle class="step" cx="30" cy="54" r="11"/><text class="mono num" x="30" y="58" text-anchor="middle">3</text>
    <text class="mono lbl" x="48" y="58" fill="#c8d3f5">the daily check</text>
    <text class="mono sub" x="175" y="58">first dev of the day</text>
    <text class="mono cmd" x="28" y="82"><tspan fill="#8ff0c8">❯</tspan> dev</text>
    <text class="mono out" x="28" y="102"><tspan fill="#8ec5ff" font-weight="700">==&gt;</tspan> Daily check: security advisories and repository state …</text>
    <text class="mono ask" x="28" y="125">The repository has 1 new commit(s),</text>
    <text class="mono ask" x="28" y="144">run 'samebench sync' now? [y/N] <tspan fill="#8ff0c8">y</tspan></text>

    <rect class="act" x="12" y="166" width="426" height="150" rx="8"/>
    <circle class="step" cx="30" cy="186" r="11"/><text class="mono num" x="30" y="190" text-anchor="middle">4</text>
    <text class="mono lbl" x="48" y="190" fill="#8ff0c8">samebench sync</text>
    <text class="mono sub" x="167" y="190">then samebench apply</text>
    <text class="mono out" x="28" y="214"><tspan fill="#8ec5ff" font-weight="700">==&gt;</tspan> Fetching the repository's latest state</text>
    <text class="mono sub" x="48" y="232">4f2c1a9 you: Build: update locked versions</text>
    <text class="mono out" x="34.6" y="252"><tspan fill="#c3e88d" font-weight="700">ok</tspan> All 1 commit(s) carry your signature.</text>
    <text class="mono ask" x="28" y="276">Take this state? [y/N] <tspan fill="#8ff0c8">y</tspan></text>
    <text class="mono out" x="28" y="298"><tspan fill="#8ec5ff" font-weight="700">==&gt;</tspan> Installing tools exactly as listed in mise.lock</text>
  </g>

  <!-- Wire 2: the push, from the updater onto a rail that touches all four lockfiles -->
  <path class="wire" d="M438 197 H536"/>
  <path class="wire" d="M536 146 V248 M536 146 H546 M536 180 H546 M536 214 H546 M536 248 H546"/>
  <circle class="plug" cx="438" cy="197" r="5"/>

  <!-- Wire 3: from the new commit on main to the daily check of every other machine -->
  <path class="wire" d="M662.5 93 H842"/>
  <circle class="plug" cx="842" cy="93" r="5"/>
  <circle cx="704" cy="93" r="6" fill="#8ff0c8" stroke="#14162a" stroke-width="2"/>
  <circle cx="704" cy="93" r="10" fill="none" stroke="#8ff0c8" stroke-opacity="0">
    <animate attributeName="stroke-opacity" dur="8s" repeatCount="indefinite" values="0;0;0.9;0;0" keyTimes="0;0.34;0.38;0.46;1"/>
  </circle>

  <!-- The step numbers on the wires, in the order of the steps -->
  <circle class="step" cx="485" cy="197" r="11"/><text class="mono num" x="485" y="201" text-anchor="middle">2</text>
  <circle class="step" cx="795" cy="93" r="11"/><text class="mono num" x="795" y="97" text-anchor="middle">3</text>

  <!-- Every 8 seconds a light carries the push into the repository, the lockfiles light up, the new commit
       pulses, and a second light carries it on to the other machines. Both lights are invisible in the first
       frame, so a still image shows the plain picture. -->
  <circle cy="197" r="3.5" fill="#eef1ff" opacity="0">
    <animate attributeName="cx" dur="8s" repeatCount="indefinite" values="438;438;536;536" keyTimes="0;0.08;0.2;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.07;0.09;0.19;0.21;1"/>
  </circle>
  <circle cy="93" r="3.5" fill="#eef1ff" opacity="0">
    <animate attributeName="cx" dur="8s" repeatCount="indefinite" values="704;704;842;842" keyTimes="0;0.38;0.52;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.37;0.39;0.51;0.53;1"/>
  </circle>
</svg>
