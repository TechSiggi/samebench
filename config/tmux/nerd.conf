# Addition for profiles with ICONS="nerd" (copied by "samebench apply" to
# ~/.config/samebench/tmux.conf): round pills and a Git icon.
# Needs a Nerd Font in the terminal (Mac: JetBrainsMono Nerd Font Mono).
set -g status-left "#{?client_prefix,#[fg=#ffc27a],#[fg=#8ff0c8]}#[bg=default]#{?client_prefix,#[bg=#ffc27a],#[bg=#8ff0c8]}#[fg=#14162a]#[bold]#S#[default]#{?client_prefix,#[fg=#ffc27a],#[fg=#8ff0c8]}#[default]  "
setw -g window-status-current-format "#[fg=#2a2e45]#[bg=default]#[bg=#2a2e45]#[fg=#8ff0c8]#[bold]#I:#W#[default]#[fg=#2a2e45]#[default]"
setw -g window-status-format " #[fg=#6b7089]#I:#W "
set -g status-right "#[fg=#c3a6ff]#(b=\$(git -C #{q:pane_current_path} branch --show-current 2>/dev/null) && [ -n \"\$b\" ] && printf ' %%s  ' \"\$b\")#[fg=#6b7089]%H:%M  #[fg=#2a2e45]#[bg=#2a2e45]#[fg=#c8d3f5]#h#[default]#[fg=#2a2e45]#[default]"
