# tmux configuration for dev sessions (separate server: tmux -L samebench -f <this file>).
# The prefix stays Ctrl+b (the default, matches every guide on the web).

# ---------------------------------------------------------- Terminal ------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB,*256col*:RGB"
# Pass clickable links (OSC 8, e.g. from jlab) through to the terminal
set -as terminal-features ",*:hyperlinks"
set -g escape-time 10        # otherwise Esc in Neovim reacts with a noticeable delay
set -g focus-events on       # Neovim notices focus changes → reloads changed files
# Only tmux itself may set the outer clipboard through OSC 52 (also over SSH), for
# example from copy mode or with "tmux load-buffer -w", which Neovim uses over SSH.
# Programs and printed text in a pane may not, so a hostile file shown with cat
# cannot fill the clipboard.
set -g set-clipboard external
# On the Mac: text selected with the mouse goes straight to the clipboard (Cmd+V)
if-shell "command -v pbcopy" "set -s copy-command pbcopy"
set -g mouse on              # the mouse may help at the beginning
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
setw -g mode-keys vi

# ---------------------------------------------------------- Controls ------
# Prefix + r: reload the configuration (dev sets $SAMEBENCH_REPO when starting the server)
bind r source-file "$SAMEBENCH_REPO/config/tmux/tmux.conf" \; display "tmux configuration reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# Prefix + g: lazygit as a popup in the current folder
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
# Prefix + o: open the running JupyterLab in the browser (Mac, WSL) or show its address (over SSH)
bind o run-shell -c "#{pane_current_path}" "\"$SAMEBENCH_REPO/bin/jlab\""
# Prefix + Ctrl+l: clear the screen (Ctrl+l alone switches the pane)
bind C-l send-keys C-l
# Copy mode like in Vim: Prefix + [ , then v to select, y to copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ------------------ Seamlessly between Neovim windows and tmux panes ------
# Ctrl+h/j/k/l moves through Neovim splits and, at their edge, on into
# the next tmux pane (counterpart: config/nvim/lua/config/keymaps.lua).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# -------------------------------------------- Appearance: "Liquid Glass" --
# Transparent bar (the terminal's glass effect shines through), pills in mint.
# Active pane opaque dark, inactive panes made of glass.
# Colors: mint #8ff0c8 · dark text #14162a · surface #2a2e45 · muted #6b7089
set -g status-position bottom
set -g status-style "bg=default,fg=#6b7089"
set -g status-left-length 40
set -g status-right-length 100
# Session pill: mint, turns orange while the prefix (Ctrl+b) is active
set -g status-left "#{?client_prefix,#[bg=#ffc27a],#[bg=#8ff0c8]}#[fg=#14162a]#[bold] #S #[default]  "
# Right: Git branch of the active pane, CPU, memory and free disk (libexec/tmux-status),
# time. Updated every 15 s. (q: escapes the path for the shell, a folder name must
# never become a command)
set -g status-interval 15
set -g status-right "#[fg=#c3a6ff]#(b=\$(git -C #{q:pane_current_path} branch --show-current 2>/dev/null) && [ -n \"\$b\" ] && printf '⎇ %%s  ' \"\$b\")#(\"\$SAMEBENCH_REPO/libexec/tmux-status\")#[fg=#6b7089]%H:%M "
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#6b7089] #I:#W "
setw -g window-status-current-format "#[bg=#2a2e45]#[fg=#8ff0c8]#[bold] #I:#W #[default]"
setw -g window-status-activity-style "fg=#ffc27a"

# Borders and pane names
set -g pane-border-lines single
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#8ff0c8"
set -g pane-border-status top          # show pane names (code, agent, kernel …) at the top
# Pane name + running program (except for an idle shell), e.g. "kernel · python3.12"
set -g pane-border-format "#{?pane_active,#[fg=#8ff0c8]#[bold],#[fg=#6b7089]} #{pane_title}#{?#{m/r:^-?(zsh|bash|sh|fish|dash)$,#{pane_current_command}},, · #{pane_current_command}} "
set -g allow-set-title off             # programs may not overwrite the pane names

# Active pane opaque dark (calm, easy to read), inactive panes made of glass.
# "terminal" = the real terminal background (glass). Note: "default" would be
# wrong here, because in the active style "default" only inherits the color from window-style.
set -g window-style "bg=terminal"
set -g window-active-style "bg=#16182a"

# Popups (lazygit), messages, copy mode
set -g popup-border-lines rounded
set -g popup-border-style "fg=#8ff0c8"
set -g message-style "bg=#2a2e45,fg=#8ff0c8"
set -g message-command-style "bg=#2a2e45,fg=#8ff0c8"
setw -g mode-style "bg=#3a4060,fg=#8ff0c8"
setw -g clock-mode-colour "#8ff0c8"
set -g display-panes-active-colour "#8ff0c8"
set -g display-panes-colour "#6b7089"

# Machine-specific additions (not in the repo)
# Profile addition from "samebench apply" (e.g. round pills with a Nerd Font)
source-file -q ~/.config/samebench/tmux.conf
if-shell "test -f ~/.config/tmux/local.conf" "source-file ~/.config/tmux/local.conf"
